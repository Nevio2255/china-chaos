name: 🐉 China Chaos Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: 📥 Repository laden
        uses: actions/checkout@v4

      - name: 🟢 Node.js 22 installieren
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Projekt installieren
        run: npm ci

      - name: 🌐 Web-Version bauen
        run: npm run build

      - name: 🖥️ Desktop Builder installieren
        run: |
          npm install --no-save electron@35 electron-builder@26

      - name: 🗑️ Server SQLite aus Desktop-Build entfernen
        shell: powershell
        run: |
          if (Test-Path "node_modules/better-sqlite3") {
            Remove-Item "node_modules/better-sqlite3" -Recurse -Force
          }

          Write-Host "better-sqlite3 wurde aus dem Desktop-Paket entfernt."

      - name: 🐉 Windows Installer bauen
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder `
            --win nsis `
            --publish never `
            -c.npmRebuild=false

      - name: 🔎 Ergebnis anzeigen
        shell: powershell
        run: |
          Write-Host "===== CHINA CHAOS WINDOWS BUILD ====="

          if (Test-Path "dist-desktop") {
            Get-ChildItem "dist-desktop" -Recurse
          } else {
            Write-Error "dist-desktop wurde nicht erstellt."
            exit 1
          }

      - name: 📤 China Chaos Windows hochladen
        uses: actions/upload-artifact@v4
        with:
          name: China-Chaos-Windows
          path: |
            dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 30
