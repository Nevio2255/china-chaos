name: 🐉 China Chaos Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: 📥 Repository laden
        uses: actions/checkout@v4

      - name: 🟢 Node.js 22 installieren
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # npm install statt npm ci:
      # aktualisiert die Abhängigkeiten während des Builds,
      # auch wenn package-lock.json noch nicht synchron ist.
      - name: 📦 Dependencies installieren
        run: npm install --no-audit --no-fund

      - name: 🌐 Web-Version testen
        run: npm run build

      - name: 🔍 Desktop-Dateien prüfen
        shell: powershell
        run: |
          if (!(Test-Path "desktop/main.cjs")) {
            Write-Error "desktop/main.cjs fehlt!"
            exit 1
          }

          Write-Host "desktop/main.cjs gefunden."
          Write-Host "Electron Version:"
          npx electron --version

          Write-Host "Electron Builder Version:"
          npx electron-builder --version

      - name: 🐉 Windows Installer bauen
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run desktop:build

      - name: 🔎 EXE suchen
        shell: powershell
        run: |
          Write-Host "===== CHINA CHAOS WINDOWS BUILD ====="

          if (!(Test-Path "dist-desktop")) {
            Write-Error "dist-desktop wurde nicht erstellt."
            exit 1
          }

          Get-ChildItem "dist-desktop" -Recurse

          $exe = Get-ChildItem "dist-desktop" `
            -Filter "ChinaChaos-Setup-*.exe" `
            -Recurse

          if (!$exe) {
            Write-Error "Keine China Chaos Setup EXE gefunden."
            exit 1
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "CHINA CHAOS EXE ERFOLGREICH ERSTELLT"
          Write-Host "======================================"

          $exe.FullName

      - name: 📤 China Chaos EXE hochladen
        uses: actions/upload-artifact@v4
        with:
          name: China-Chaos-Windows
          path: dist-desktop/ChinaChaos-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
