name: 🐉 China Chaos Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: 📥 Repository laden
        uses: actions/checkout@v4

      - name: 🟢 Node.js 22 installieren
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Projekt-Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: ⚡ Electron installieren
        run: npm install --no-save --no-audit --no-fund electron@35.7.5 electron-builder@26.15.3 electron-updater@6.6.2

      - name: 🔎 Electron prüfen
        shell: powershell
        run: |
          Write-Host "Electron:"
          npx electron --version

          Write-Host "Electron Builder:"
          npx electron-builder --version

          if (!(Test-Path "desktop/main.cjs")) {
            Write-Error "desktop/main.cjs fehlt."
            exit 1
          }

          Write-Host "desktop/main.cjs gefunden."

      - name: 🌐 Web-Version bauen
        run: npm run build

      - name: 🐉 Windows Installer bauen
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder `
            --win nsis `
            --publish never `
            --config.npmRebuild=false

      - name: 📁 Release-Dateien sammeln
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release-files" | Out-Null

          $searchFolders = @(
            "dist-desktop",
            "dist"
          )

          $installerFound = $false

          foreach ($folder in $searchFolders) {

            if (!(Test-Path $folder)) {
              continue
            }

            Write-Host "Prüfe $folder..."

            $installers = Get-ChildItem `
              -Path $folder `
              -Filter "*.exe" `
              -File `
              -Recurse |
              Where-Object {
                $_.FullName -notmatch "win-unpacked"
              }

            foreach ($file in $installers) {

              Write-Host "Installer gefunden:"
              Write-Host $file.FullName

              Copy-Item `
                $file.FullName `
                -Destination "release-files/$($file.Name)" `
                -Force

              $installerFound = $true
            }

            $latestFiles = Get-ChildItem `
              -Path $folder `
              -Filter "latest.yml" `
              -File `
              -Recurse

            foreach ($file in $latestFiles) {

              Write-Host "Auto-Update Datei gefunden:"
              Write-Host $file.FullName

              Copy-Item `
                $file.FullName `
                -Destination "release-files/latest.yml" `
                -Force
            }

            $blockmaps = Get-ChildItem `
              -Path $folder `
              -Filter "*.blockmap" `
              -File `
              -Recurse

            foreach ($file in $blockmaps) {

              Write-Host "Blockmap gefunden:"
              Write-Host $file.FullName

              Copy-Item `
                $file.FullName `
                -Destination "release-files/$($file.Name)" `
                -Force
            }
          }

          if (!$installerFound) {
            Write-Error "Keine China Chaos Setup EXE gefunden."
            exit 1
          }

          Write-Host ""
          Write-Host "=============================="
          Write-Host "CHINA CHAOS RELEASE DATEIEN"
          Write-Host "=============================="

          Get-ChildItem "release-files"

      - name: 📤 Windows-Version hochladen
        uses: actions/upload-artifact@v4
        with:
          name: China-Chaos-Windows
          path: release-files/*
          if-no-files-found: error
          retention-days: 30

      - name: 🚀 GitHub Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: China Chaos ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-files/*.exe
            release-files/*.yml
            release-files/*.blockmap
