name: 🐉 China Chaos Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: 📥 Repository laden
        uses: actions/checkout@v4

      - name: 🟢 Node.js 22 installieren
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Projekt installieren
        run: npm ci

      - name: 🌐 Web-Version bauen
        run: npm run build

      - name: 🖥️ Electron installieren
        run: npm install --no-save electron@35 electron-builder@26

      - name: 🗑️ better-sqlite3 aus Desktop-Build entfernen
        shell: powershell
        run: |
          if (Test-Path "node_modules/better-sqlite3") {
            Remove-Item "node_modules/better-sqlite3" -Recurse -Force
          }

          Write-Host "SQLite Desktop-Abhängigkeit entfernt."

      - name: 🐉 Windows Installer bauen
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --win nsis --publish never --config.npmRebuild=false

      - name: 🔎 EXE suchen
        shell: powershell
        run: |
          Write-Host "===== CHINA CHAOS WINDOWS BUILD ====="

          if (!(Test-Path "dist-desktop")) {
            Write-Error "dist-desktop wurde nicht erstellt."
            exit 1
          }

          Get-ChildItem "dist-desktop" -Recurse

          $exe = Get-ChildItem "dist-desktop" -Filter "*.exe" -Recurse

          if (!$exe) {
            Write-Error "Keine EXE gefunden."
            exit 1
          }

          Write-Host "EXE erfolgreich erstellt:"
          $exe.FullName

      - name: 📤 Windows-Version hochladen
        uses: actions/upload-artifact@v4
        with:
          name: China-Chaos-Windows
          path: dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 30
