<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>China Chaos Admin</title><link rel="stylesheet" href="/admin.css"></head><body><main><header><div><h1>🐉 China Chaos Admin</h1><p id="status">Verbinde…</p></div><button id="logout">Abmelden</button></header><section id="login" class="card"><h2>Admin Login</h2><input id="password" type="password" placeholder="Admin-Passwort"><button id="loginBtn">Anmelden</button><p id="loginMsg"></p></section><div id="panel" hidden><section class="card"><div class="title"><div><h2>🚀 Update Center</h2><p class="muted">Spiel offline nehmen, Version vorbereiten und Update ankündigen.</p></div><span id="maintBadge" class="pill">ONLINE</span></div><div class="player"><label>Version <input id="versionInput" value="5.1.0"></label><label style="flex:1">Update-Notiz <input id="notesInput" placeholder="Was ist neu?"></label><div class="actions"><button id="saveVersion">Version speichern</button><button class="danger" id="maintenanceBtn">🛠️ Offline / Update</button><button id="announceBtn">📣 Update verfügbar</button></div></div><p id="desktopState" class="muted"></p></section><section class="stats"><div class="card"><b id="roomsN">0</b><span>Räume</span></div><div class="card"><b id="playersN">0</b><span>Spieler online</span></div><div class="card"><b id="uptime">0m</b><span>Uptime</span></div></section><section class="card"><div class="title"><h2>Live Lobbys</h2><button id="refresh">Aktualisieren</button></div><div id="rooms"></div></section><section class="card"><h2>Leaderboard verwalten</h2><div id="leaderboard"></div></section><section class="card"><h2>Records</h2><div id="records"></div></section></div></main><script src="/admin.js"></script></body></html>
